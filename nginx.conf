server {
    listen 80 default_server;
    server_name 103.250.10.163;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_intercept_errors on;
        error_page 502 503 504 = @streamlit_reconnecting;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400;
    }

    location @streamlit_reconnecting {
        internal;
        default_type text/html;
        add_header Cache-Control "no-store";
        add_header Refresh "2";
        return 200 '<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="2"><title>Difotoin Dashboard</title><style>body{margin:0;background:#1a1a1a;color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}.box{max-width:520px;padding:28px;border:1px solid #333;border-radius:8px;background:#111}h1{font-size:22px;margin:0 0 10px}p{color:#cbd5e1;line-height:1.5}</style></head><body><div class="box"><h1>Dashboard sedang reconnect</h1><p>Server Streamlit sedang restart atau menyambung ulang. Halaman ini akan refresh otomatis dalam beberapa detik.</p></div></body></html>';
    }
}
